name = "agentverify-api"
main = "src/worker.ts"
compatibility_date = "2025-05-19"

[vars]
FIREBASE_PROJECT_ID = "agentverify-26e26"
STRIPE_PRO_PRICE_ID = "price_1Tsm6SRqPRlpuX8nDm5HzHZb"
BILLING_SUCCESS_URL = "https://aimodularity.com/agentverify/dashboard/?billing=success"
BILLING_CANCEL_URL = "https://aimodularity.com/agentverify/pricing/?billing=cancel"
BILLING_ENABLED = "true"
ATTESTATION_ISSUER = "agentverify-prod"
# Profile-attestation signing (workers/api/src/profileAttestationSigning.ts) -- a separate, domain-separated
# key/purpose/issuer from the legacy ATTESTATION_ISSUER above; see docs/profile-attestation-production-
# checklist.md. Non-secret: safe as a plain var, same as ATTESTATION_ISSUER. PROFILE_ATTESTATION_KEY_PURPOSE
# is a fixed protocol constant (must equal packages/scanner/src/profileAttestation.ts's PROFILE_KEY_PURPOSE
# exactly) -- it is not a naming choice. The PRIVATE KEY itself is never set here: it is a `wrangler secret`
# (see the checklist).
PROFILE_ATTESTATION_ISSUER = "agentverify-profile-prod"
PROFILE_ATTESTATION_KEY_PURPOSE = "agentverify-profile-v1"
# Pinned per checklist step 4, once and only once, after the production key was provisioned and its keyId
# independently verified as the RFC 7638 thumbprint of the published public key (2026-09-22):
# eIO7_uhceQOQ0FDx5bGCODcYEUPkbSgAcuXczunT1QA. Not secret -- the same value the public route publishes.
# Changing this on a future key rotation is deliberate: a mismatch here refuses to sign (key-identity-mismatch,
# 503) rather than silently signing under an unexpected key.
PROFILE_ATTESTATION_EXPECTED_KEY_ID = "eIO7_uhceQOQ0FDx5bGCODcYEUPkbSgAcuXczunT1QA"

[[d1_databases]]
binding = "BILLING_DB"
database_name = "agentverify-billing-prod"
database_id = "92d01f37-5a2b-4541-9ba7-8a01513ef699"

# Drives webhook delivery: the scheduled() handler in worker.ts sweeps webhook_deliveries for rows
# due for an attempt (schema/webhooks.sql, applied to the same BILLING_DB above). Every minute is
# the finest grain Cron Triggers support; delivery latency for a fresh event is therefore up to
# ~60s in the worst case, then real exponential backoff (1m/5m/30m/2h/12h) between retries after
# that. Not deployed until this config is applied via `wrangler deploy`.
[triggers]
crons = ["* * * * *"]